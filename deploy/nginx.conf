# Example for a dedicated subdomain. Replace wa.example.com and TLS certificate paths.
# Redirect HTTP to HTTPS in your hosting panel / web server.
server {
    listen 443 ssl;
    server_name wa.example.com;
    ssl_certificate /etc/letsencrypt/live/wa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.example.com/privkey.pem;
    client_max_body_size 256k;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
