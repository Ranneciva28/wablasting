<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Setup awal — WABlast</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/style.css?v=0.4.0" />
    <script defer src="/setup.js?v=0.4.0"></script>
  </head>
  <body class="setup">
    <main class="setup-card">
      <a href="/" class="brand" aria-label="Beranda">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#24307f" />
          <path d="M8.5 9h9.5a3.5 3.5 0 0 1 3.5 3.5v4a3.5 3.5 0 0 1-3.5 3.5h-4.6L9.6 23v-3.1A3.5 3.5 0 0 1 5 16.5v-4A3.5 3.5 0 0 1 8.5 9z" fill="#fff" />
          <path d="M24.2 10.6a7 7 0 0 1 0 7.8M26.9 8.4a10.4 10.4 0 0 1 0 12.2" stroke="#f2b33d" stroke-width="2" stroke-linecap="round" fill="none" />
        </svg>
        <span>WABlast</span>
      </a>
      <h1>Buat akun admin</h1>
      <p>
        Akun ini mengelola seluruh layanan. Brand, SMTP, rekening, dan harga
        paket bisa diatur nanti di Pengaturan platform.
      </p>
      <p id="setup-notice" role="status"></p>
      <form id="setup-form">
        <label
          >Email admin<input
            name="email"
            type="email"
            autocomplete="username"
            placeholder="admin@bisnismu.com"
            required /></label
        ><label
          >Password<input
            name="password"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            placeholder="Minimal 12 karakter"
            required /></label
        ><label
          >Ulangi password<input
            name="confirm"
            type="password"
            minlength="12"
            maxlength="128"
            autocomplete="new-password"
            required /></label
        ><button class="primary">Buat akun & buka panel</button>
      </form>
      <p id="setup-help" class="muted" hidden>
        Buka halaman ini lewat tautan setup pribadi dari hasil instalasi
        server. Tanpa tautan itu, akun admin tidak bisa dibuat dari sini.
      </p>
    </main>
  </body>
</html>
